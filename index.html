<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastCare - Healthcare Network</title>
    <!-- Favicon placeholder -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
</head>
<body>
    <!-- Page Loading Indicator Commented Out -->
    <!--
    <div id="page-loader" class="d-flex justify-content-center align-items-center" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255,255,255,0.9); z-index: 9999;">
        <div class="text-center">
            <div class="spinner-border text-primary mb-3" role="status">
                <span class="sr-only">Loading...</span>
            </div>
            <p class="font-weight-medium">Loading FastCare...</p>
        </div>
    </div>
    -->
    
    <!-- Main App Structure -->
    <div class="app-container">
        <div id="header"></div>
        <div id="content" class="main-content"></div>
        <div id="footer"></div>
    </div>

    <!-- Alert Template -->
    <div class="app-alerts position-fixed" style="top: 20px; right: 20px; z-index: 9000; max-width: 350px;"></div>

    <!-- Scripts -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="loadcomponents.js"></script>
    <script src="script.js"></script>
    <script>
        /* // Function to hide the loader (Commented out)
        function hideLoader() {
            const loader = document.getElementById('page-loader');
            if (loader) {
                loader.style.display = 'none';
            }
        }
        */

        // Function to execute scripts specific to home.html
        function initializeHomeScripts() {
            if (typeof populateAppointmentTable === 'function') {
                populateAppointmentTable();
            }
            if (typeof fetchUserInfo === 'function') {
                fetchUserInfo();
            }
            const skipButton = document.getElementById('skipButton');
            if (skipButton && typeof handleSkipButtonClick === 'function') {
                // Remove existing listener to avoid duplicates if home is reloaded
                skipButton.removeEventListener('click', handleSkipButtonClick);
                skipButton.addEventListener('click', handleSkipButtonClick);
            }
        }
        
        // Function to initialize scripts for patientScheduler.html
        function initializePatientSchedulerScripts() {
            if (typeof initializeSchedulerPage === 'function') {
                initializeSchedulerPage();
            }
        }

        // Global navigation function
        function navigateTo(pageUrl) {
            loadComponent(pageUrl, 'content')
                .then(() => {
                    console.log(pageUrl + ' loaded successfully.');
                    // Call specific initializers based on the loaded page
                    if (pageUrl === 'home.html') {
                        initializeHomeScripts();
                    } else if (pageUrl === 'patientScheduler.html') {
                        initializePatientSchedulerScripts();
                    }
                    // Add more else if blocks for other pages as needed
                })
                .catch(error => {
                    console.error('Error loading page: ' + pageUrl, error);
                    showAlert('Could not load page: ' + pageUrl, 'danger');
                });
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            Promise.all([
                loadComponent('header.html', 'header', { showLoader: false }),
                loadComponent('footer.html', 'footer', { showLoader: false })
            ])
            .then(() => {
                navigateTo('home.html'); // Load home page by default
            })
            .catch(error => {
                console.error('Error initializing app (header/footer):', error);
                // hideLoader(); // Loader hiding is removed
                showAlert('Error initializing core components. Please refresh.', 'danger');
            });

            // Failsafe for loader is removed as loader is removed
            // setTimeout(hideLoader, 3000);
        });

        // Helper function to show alerts
        function showAlert(message, type = 'info') {
            const alertContainer = document.querySelector('.app-alerts');
            if (!alertContainer) return;

            const alertEl = document.createElement('div');
            alertEl.className = `alert alert-${type} alert-dismissible fade show`;
            alertEl.role = 'alert';
            alertEl.innerHTML = `
                ${message}
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            `;
            alertContainer.appendChild(alertEl);
            
            setTimeout(() => {
                $(alertEl).alert('close');
            }, 5000);
        }
    </script>
</body>
</html>

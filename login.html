<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastCare</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Firebase scripts with type="module" -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js" type="module"></script>
    <style>
        /* Styling for the sample credentials box */
        .sample-credentials {
            background-color: rgba(255, 255, 255, 0.8); /* Light background with transparency */
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .sample-credentials h5 {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .sample-credentials p {
            font-size: 1rem;
            color: #555;
        }

        /* Hover effect for the sample credentials box */
        .sample-credentials:hover {
            transform: scale(1.05);
            opacity: 1;
        }

        /* Background effect for light design */
        body {
            background-color: #f4f4f9;
            background-image: linear-gradient(135deg, rgba(0, 0, 0, 0.05), rgba(255, 255, 255, 0.3));
        }
    </style>
</head>
<body>
    <div id="header"></div>
    <div class="container">
        <div class="row justify-content-center">
            <!-- Login Form Section -->
            <div class="col-md-6">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <div class="form-group">
                        <label for="role">Login as:</label>
                        <select class="form-control" id="role" required>
                            <option value="" disabled selected>Select your role</option>
                            <option value="doctor">Doctor</option>
                            <option value="patient">Patient</option>
                        </select>
                    </div>
                    <div class="row justify-content-center">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                    <p class="text-center">Don't have an account? <a href="signup.html">Sign up</a></p>
                    <p class="text-center">
                        Forgot your password? <a href="#" id="resetPasswordLink">Reset Password</a>
                    </p>
                    <div id="error-message" class="text-danger text-center mt-3"></div>
                </form>
            </div>

            <!-- Sample Credentials Section -->
            
        </div>
        <div class="col-md-4">
            <div class="sample-credentials">
                <h5>Sample Login Credentials</h5>
                <p><strong>Email:</strong> foodfathers@gmail.com</p>
                <p><strong>Password:</strong> Fast@1234</p>
                <p><strong>Role:</strong> Select either Doctor or Patient after logging in</p>
            </div>
        </div>
    </div>
    <div id="footer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAyf4Nz_IpQ-kZ7YZoV-U8hR45lW_oquyE",
            authDomain: "fastcare-5c2e5.firebaseapp.com",
            projectId: "fastcare-5c2e5",
            storageBucket: "fastcare-5c2e5.appspot.com",
            messagingSenderId: "581612897761",
            appId: "1:581612897761:web:365d069d03843b66bf3ea0"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Login logic
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Signed in successfully
                    console.log('User signed in:', userCredential.user);
                    if (role === 'doctor') {
                        window.location.href = 'index.html'; // Redirect to doctor dashboard
                    } else if (role === 'patient') {
                        window.location.href = 'Patient Portal/patient-dashboard.html'; // Redirect to patient dashboard
                    } else {
                        // Handle case if role is not selected properly
                        document.getElementById('error-message').textContent = 'Please select a valid role.';
                    }
                })
                .catch((error) => {
                    // Display error message on the page
                    const errorMessage = document.getElementById('error-message');
                    switch (error.code) {
                        case 'auth/invalid-email':
                            errorMessage.textContent = 'Invalid email address.';
                            break;
                        case 'auth/user-not-found':
                            errorMessage.textContent = 'No user found with this email.';
                            break;
                        case 'auth/wrong-password':
                            errorMessage.textContent = 'Incorrect password.';
                            break;
                        default:
                            errorMessage.textContent = 'Error signing in. Please try again.';
                    }
                });
        });

        // Reset password logic
        document.getElementById('resetPasswordLink').addEventListener('click', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            if (email) {
                sendPasswordResetEmail(auth, email)
                    .then(() => {
                        // Inform the user that the password reset email has been sent
                        alert('Password reset email sent. Please check your inbox.');
                    })
                    .catch((error) => {
                        const errorMessage = document.getElementById('error-message');
                        switch (error.code) {
                            case 'auth/invalid-email':
                                errorMessage.textContent = 'Invalid email address.';
                                break;
                            case 'auth/user-not-found':
                                errorMessage.textContent = 'No user found with this email.';
                                break;
                            default:
                                errorMessage.textContent = 'Error sending reset email. Please try again.';
                        }
                    });
            } else {
                document.getElementById('error-message').textContent = 'Please enter your email to reset the password.';
            }
        });
    </script>

    <script src="loadcomponents.js"></script>
</body>
</html>
